<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>北海道自由行旅遊計畫</title>

  <style>
    *{
      margin:0;
      padding:0;
      box-sizing:border-box;
    }

    body{
      font-family:"Noto Sans TC",sans-serif;
      background:#121212;
      color:#f1f1f1;
      line-height:1.7;
    }

    header{
      background:linear-gradient(135deg,#1f3b57,#27496d);
      color:white;
      padding:50px 20px;
      text-align:center;
      border-bottom:1px solid rgba(255,255,255,0.08);
    }

    header h1{
      font-size:42px;
      margin-bottom:10px;
    }

    header p{
      font-size:18px;
      opacity:0.9;
    }

    .container{
      max-width:1100px;
      margin:40px auto;
      padding:0 20px;
    }

    .hotel-section{
      background:#1e1e1e;
      border-radius:22px;
      padding:25px;
      margin-bottom:35px;
      box-shadow:0 10px 30px rgba(0,0,0,0.35);
      border:1px solid rgba(255,255,255,0.05);
    }

    .hotel-section h2{
      margin-bottom:20px;
      color:#8fd3ff;
    }

    .hotel-card{
      background:#2a2a2a;
      border-left:6px solid #5eb5ff;
      padding:18px;
      border-radius:14px;
      margin-bottom:15px;
    }

    .hotel-card a{
      color:#8fd3ff;
      text-decoration:none;
      word-break:break-all;
    }

    .hotel-card a:hover{
      text-decoration:underline;
    }

    .day-card{
      background:#1e1e1e;
      border-radius:24px;
      padding:30px;
      margin-bottom:35px;
      box-shadow:0 10px 30px rgba(0,0,0,0.35);
      transition:0.25s;
      border:1px solid rgba(255,255,255,0.05);
    }

    .day-card:hover{
      transform:translateY(-4px);
    }

    .day-title{
      display:flex;
      align-items:center;
      gap:14px;
      margin-bottom:20px;
    }

    .day-number{
      width:56px;
      height:56px;
      border-radius:50%;
      background:linear-gradient(135deg,#5eb5ff,#3f8cff);
      color:white;
      display:flex;
      align-items:center;
      justify-content:center;
      font-size:24px;
      font-weight:bold;
      box-shadow:0 4px 12px rgba(94,181,255,0.4);
    }

    .day-title h2{
      color:#8fd3ff;
      font-size:28px;
    }

    .timeline{
      margin-top:15px;
    }

    .timeline-item{
      position:relative;
      padding-left:30px;
      margin-bottom:20px;
    }

    .timeline-item::before{
      content:"";
      position:absolute;
      left:0;
      top:10px;
      width:12px;
      height:12px;
      border-radius:50%;
      background:#5eb5ff;
      box-shadow:0 0 10px rgba(94,181,255,0.7);
    }

    .timeline-item h3{
      font-size:18px;
      color:#ffffff;
      margin-bottom:6px;
    }

    .timeline-item p{
      color:#d3d3d3;
    }

    .note{
      background:#2d2412;
      border-left:5px solid #ffcb52;
      padding:14px;
      border-radius:12px;
      margin-top:20px;
    }

    .note h4{
      margin-bottom:8px;
      color:#ffd978;
    }

    .note p{
      color:#f3e7c3;
    }

    a{
      color:#8fd3ff;
    }

    .tag{
      display:inline-block;
      background:#263849;
      color:#9ddcff;
      padding:5px 12px;
      border-radius:999px;
      font-size:14px;
      margin-right:8px;
      margin-top:8px;
      border:1px solid rgba(255,255,255,0.08);
    }

    footer{
      text-align:center;
      padding:40px 20px;
      color:#888;
      font-size:14px;
    }

    ::selection{
      background:#5eb5ff;
      color:white;
    }

    @media(max-width:768px){

      header h1{
        font-size:32px;
      }

      .day-title{
        align-items:flex-start;
      }

      .day-title h2{
        font-size:22px;
      }

      .day-card{
        padding:24px;
      }
    }
  </style>
</head>

<body>

<header>
  <h1>北海道自由行 ✈️</h1>
  <p>札幌・小樽・函館 6 日旅遊計畫</p>
</header>

<div class="container">

  <section class="hotel-section">
    <h2>🏨 住宿資訊</h2>

    <div class="hotel-card">
      <h3>ベッセルイン札幌中島公園</h3>
      <p>入住日期：4/24 ～ 4/27</p>
      <a href="https://maps.app.goo.gl/xtSGCw6yL4jSUj6T9?g_st=ac" target="_blank">
        查看地圖
      </a>
    </div>

    <div class="hotel-card">
      <h3>JR INN 函館</h3>
      <p>入住日期：4/27 ～ 4/29</p>
      <a href="https://maps.app.goo.gl/4NrZJn1JPb3ovfJd8?g_st=ac" target="_blank">
        查看地圖
      </a>
    </div>
  </section>

  <!-- 之後把你原本 D1~D6 的內容直接貼過來即可 -->

</div>

<footer>
  北海道自由行旅遊計畫｜札幌・小樽・函館
</footer>

</body>
</html>
